name: Safe Settings
on:
  schedule:
    - cron: "2 */4 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - safe-settings/**
      - .github/workflows/safe-settings.yml
jobs:
  safeSettingsSync:
    name: synchronize settings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github (our safe-settings configuration)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout github/safe-settings (app) to run full-sync
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: github/safe-settings
          ref: 2.1.18
          path: .safe-settings-code
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      - name: Build safe-settings app
        run: npm install
        working-directory: .safe-settings-code
      - name: Run safe-settings full-sync
        run: npm run full-sync
        working-directory: .safe-settings-code
        env:
          GH_ORG: apeirora
          APP_ID: ${{ secrets.APEIRORA_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.APEIRORA_BOT_PRIVATE_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.APEIRORA_BOT_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APEIRORA_BOT_CLIENT_SECRET }}
          ADMIN_REPO: .github
          # LOG_LEVEL: trace
          CONFIG_PATH: safe-settings
          DEPLOYMENT_CONFIG_FILE: ${{ github.workspace }}/safe-settings/config.yml
